<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meta CHM v2 — Canopy Height Analysis</title>
    <meta
      name="description"
      content="Interactive global canopy-height analysis — threshold, classify, and measure tree canopy live in the browser, streaming cloud-native tiles."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="./style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel">
      <header>
        <div class="kicker">Taylor Geospatial Engine · cloud-native</div>
        <h1>Canopy Height Analysis</h1>
        <p class="sub">
          Meta CHM v2 <span class="mono">(dinov3 · ml3)</span> — raw height streamed as
          PMTiles, colorized &amp; measured live on the GPU. No server.
        </p>
      </header>

      <section class="ctl">
        <div class="row">
          <label>Display</label>
          <select id="mode">
            <option value="ramp">Continuous ramp</option>
            <option value="classes">Height classes</option>
            <option value="forest">Forest mask (&gt; threshold)</option>
          </select>
        </div>

        <div class="row">
          <label>Height range <span class="mono" id="range-label">10–60 m</span></label>
          <div class="dual">
            <input type="range" id="hmin" min="0" max="60" value="10" />
            <input type="range" id="hmax" min="0" max="60" value="60" />
          </div>
        </div>

        <div class="row" id="forest-row" hidden>
          <label>Forest threshold <span class="mono" id="forest-label">5 m</span></label>
          <input type="range" id="forest-thr" min="1" max="40" value="5" />
        </div>

        <div class="row">
          <label>Opacity</label>
          <input type="range" id="opacity" min="0" max="100" value="75" />
        </div>

        <div class="legend"><span class="ramp" id="legend-ramp"></span>
          <div class="ticks mono"><span id="legend-min">10</span><span id="legend-mid">35</span><span id="legend-max">60 m</span></div>
        </div>
      </section>

      <section class="metrics" id="metrics">
        <div class="metrics-head">
          <span>Analysis — view</span><span class="mono" id="metrics-z"></span>
        </div>
        <div id="metrics-body" class="muted">Zoom in to measure the visible canopy.</div>
        <canvas id="hist" width="320" height="90" hidden></canvas>
      </section>

      <footer>
        <button id="export" class="ghost">Download tiles in view</button>
        <div class="links">
          <a href="https://data.source.coop/tge-labs/meta-chm-v2/" target="_blank" rel="noopener">data</a>
          <a href="https://github.com/taylor-geospatial/meta-chm-v2" target="_blank" rel="noopener">code</a>
          <span class="mono">CC-BY-4.0 · © Meta / Data for Good</span>
        </div>
      </footer>
    </aside>

    <div id="toast" hidden></div>
    <!-- UMD globals (maplibregl, pmtiles) — avoids esm.sh worker-bundling failures -->
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
