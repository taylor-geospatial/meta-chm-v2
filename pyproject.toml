[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11.8,<1" ]

[project]
name = "chm-zarr"
version = "0.1.0"
description = "Cloud-native rebuild of Meta CHM v2 ml3 (GeoParquet index + STAC + GeoZarr)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Isaac Corley", email = "isaac.corley@taylorgeospatial.org" },
]
requires-python = ">=3.12"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "click>=8.1",
  "duckdb>=1.1",
  "geopandas>=1",
  "icechunk>=0.2",
  "kerchunk>=0.2.10",
  "obstore>=0.3",
  "pyarrow>=18",
  "pyogrio>=0.10",
  "pystac>=1.11",
  "rasterio>=1.4",
  "s3fs>=2026.4",
  "shapely>=2",
  "stac-geoparquet>=0.8",
  "tifffile>=2026.5.15",
  "tqdm>=4.66",
  "virtualizarr>=1.3",
  "xarray>=2024.10",
  "zarr>=3",
]
scripts.chm-build-stac = "chm_zarr.cli:build_stac"
scripts.chm-build-tiles = "chm_zarr.cli:build_tiles"
scripts.chm-build-virtual-zarr = "chm_zarr.cli:build_virtual_zarr"

[dependency-groups]
dev = [
  "pre-commit>=4.3",
  "pytest>=8.4.2",
  "pytest-cov>=7",
  "ruff>=0.14.1",
  "ty>=0.0.1a23",
]
examples = [
  "odc-stac>=0.5.2",
  "rustac>=0.9.11",
]
tiles = [
  "pillow>=12.2",
  "pmtiles>=3",
  "rio-tiler>=6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
lint.extend-select = [
  "ANN",  # flake8-annotations
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "EXE",  # flake8-executable
  "FA",   # flake8-future-annotations
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PT",   # flake8-pytest-style
  "PYI",  # flake8-pyi
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "TCH",  # flake8-type-checking
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
lint.ignore = [
  "ANN401",
  "COM812",
  "COM819",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "PT012",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "RET505",
  "RET506",
  "RUF005",
  "SIM108",
  "TRY003",
  # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "W191",
]
lint.extend-per-file-ignores."examples/**" = [
  "ANN001",
  "ANN201",
]
lint.extend-per-file-ignores."scripts/**" = [
  "ANN001",
  "ANN201",
  "ANN202",
]
lint.extend-per-file-ignores."tests/**" = [
  "ANN001",
  "ANN201",
  "RUF029",
  "SIM117",
  "SIM300",
]
lint.isort.known-first-party = [ "chm_zarr" ]

[tool.ty]
# Type-check the package; exclude operational/example scripts whose numpy/xarray
# dynamic attributes (e.g. DataArray.values -> ndarray) ty cannot narrow.
src.exclude = [ "scripts/**", "slurm/**", "examples/**" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
